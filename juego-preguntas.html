  button.choice-btn {

  .score-pill {
    background: #f1eefc; color: #5b34a8; padding: 8px 16px; border-radius: 20px;

  .question-text { font-size: clamp(1.1rem, 0.95rem + 1vw, 1.7rem); color: #222; margin-bottom: clamp(20px, 2vw, 30px); line-height: 1.4; }
  .answer-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  button.answer-btn {
    background: #faf9ff; border: 2px solid #e4defa; border-radius: 10px;

  button.answer-btn:disabled { cursor: not-allowed; }

  .back-link { display: inline-block; margin-top: 16px; color: #888; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }

  .result-badge.good { background: #fff2d6; color: #8a6100; }
  .result-badge.meh { background: #f1eefc; color: #5b34a8; }

  .quiz-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }

  button.bonus-card:disabled { cursor: not-allowed; opacity: 0.7; }
  button.bonus-card.revealed { font-size: 1rem; opacity: 1; }

  /* Solo en celulares muy angostos: tarjeta a pantalla completa en vez de flotando en el centro */
  @media (max-width: 420px) {
    body { padding: 26px 16px; }
    .card { padding: clamp(22px, 5vw, 30px) clamp(16px, 4vw, 22px); }
  }
  @media (max-width: 600px) {
    .answer-list { grid-template-columns: 1fr; }
    .quiz-header {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-areas: "exit" "points" "progress";
      row-gap: 12px;
      margin-bottom: 18px;
    }
    .exit-btn { grid-area: exit; justify-self: start; }
    .score-pill { grid-area: points; justify-self: center; }
    .quiz-progress-wrap { grid-area: progress; min-width: 0; }
    .timer-row { margin-bottom: 14px; }
  }
  @media (hover: none) {
    button.choice-btn:hover:not(:disabled), button.answer-btn:hover:not(:disabled), button.bonus-card:hover:not(:disabled) { transform: none; }
  }
  @media (min-width: 700px) {
    button.choice-btn.grade-btn, button.choice-btn.subject-btn {

  .projector-title { font-size: clamp(2rem, 1.5rem + 3vw, 3.4rem); margin-bottom: 8px; }
  .projector-sub { font-size: clamp(1.1rem, 1rem + 1vw, 1.6rem); opacity: 0.85; margin-bottom: 40px; }
  .projector-list { list-style: none; text-align: left; padding: 0; }
  .projector-list li {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.14); border-radius: 16px; padding: 20px 30px; margin-bottom: 14px;
    font-size: clamp(1.2rem, 1rem + 1.5vw, 1.9rem); font-weight: 700;
  }
  .proj-rank { color: #f2c218; width: 70px; }
  .projector-list li.rank-1 { background: rgba(242,194,24,0.28); border: 2px solid #f2c218; }
  .projector-list li.rank-2 { background: rgba(220,220,230,0.22); border: 2px solid #c9c9d4; }
  .projector-list li.rank-3 { background: rgba(204,138,90,0.25); border: 2px solid #cc8a5a; }
  .proj-name { flex: 1; text-align: left; padding: 0 12px; }
  .proj-score { color: #7fb4ff; }
  .projector-empty { justify-content: center !important; opacity: 0.7; font-weight: 400 !important; font-size: 1.1rem !important; }
</style>

function renderWelcomeScreen() {

  document.getElementById("playBtn").addEventListener("click", async () => {
    if (sessionStorage.getItem("juegoAccessOk") === "1") { goAfterAccess(); return; }
    const btn = document.getElementById("playBtn");
    const statusEl = document.getElementById("welcomeStatus");
    btn.disabled = true;
    statusEl.textContent = "Cargando...";
    const realCode = await loadAccessCode();
    if (!realCode) {
      // No hay clave configurada: se entra directo, sin pedir nada.
      sessionStorage.setItem("juegoAccessOk", "1");

    btn.disabled = false;

function renderAccessScreen() {
  app.innerHTML = `

    <span class="back-link" id="backFromAccess">&larr; Volver</span>
  `;
  const input = document.getElementById("accessInput");
  input.focus();
  const btn = document.getElementById("accessBtn");
  const statusEl = document.getElementById("accessStatus");

  async function checkCode() {
    const typed = input.value.trim();
    if (!typed) { input.focus(); return; }
    btn.disabled = true;
    statusEl.textContent = "Verificando...";
    try {
      const realCode = await loadAccessCode();
      if (!realCode || typed === realCode) {
        sessionStorage.setItem("juegoAccessOk", "1");
        goAfterAccess();
      } else {
        statusEl.textContent = "Clave incorrecta.";
        btn.disabled = false;
      }
    } catch (err) {
      console.error(err);
      statusEl.textContent = "No se pudo verificar la clave. Intenta de nuevo.";
      btn.disabled = false;
    }
  }
  btn.addEventListener("click", checkCode);
  input.addEventListener("keydown", e => { if (e.key === "Enter") checkCode(); });
  document.getElementById("backFromAccess").addEventListener("click", () => { state.screen = "welcome"; render(); });
}

async function loadAccessCode() {
  if (!db) return null;
  try {
    const doc = await db.collection("config").doc("settings").get();

  }

  state.timeLeft = state.timeLimit;

  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    updateTimerVisual();
    if (state.timeLeft <= 0) {
      clearTimer();
      handleTimeout();
    }
  }, 1000);
}

function updateTimerVisual() {
  const numEl = document.getElementById("timerNum");
  const warning = state.timeLeft <= 10 && state.timeLeft > 5;
  const danger = state.timeLeft <= 5;
  if (numEl) {
    numEl.textContent = state.timeLeft;
    numEl.classList.toggle("timer-warning", warning);
    numEl.classList.toggle("timer-danger", danger);
  }
}

function clearTimer() {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }

function handleTimeout() {
  const q = state.questions[state.currentIndex];
  const buttons = app.querySelectorAll(".answer-btn");
  buttons.forEach(b => b.disabled = true);
  if (buttons[q.correct]) buttons[q.correct].classList.add("correct");
  playWrongSound();
  setTimeout(proceedAfterAnswer, 1100);
}

function proceedAfterAnswer() {
  state.currentIndex++;
  if (!state.bonusShown && state.currentIndex === 3 && state.questions.length >= 4) {
    state.bonusShown = true;
    state.screen = "bonus";
    render();
  } else if (state.currentIndex < state.questions.length) {
    render();
  } else {
    state.screen = "result";
    render();
  }
}

// Intercambia dos cartas de posición varias veces, animando el movimiento real
// entre sus posiciones viejas y nuevas (técnica FLIP), como una baraja de verdad.
function shuffleCardsAnimated(container, rounds, done) {
  let round = 0;
  function doRound() {
    if (round >= rounds) { done(); return; }
    const children = Array.from(container.children);
    const i = Math.floor(Math.random() * children.length);
    let j = Math.floor(Math.random() * children.length);
    if (j === i) j = (i + 1) % children.length;
    const a = children[i], b = children[j];

    const firstA = a.getBoundingClientRect();
    const firstB = b.getBoundingClientRect();

    const placeholder = document.createComment("");
    container.insertBefore(placeholder, a);
    container.insertBefore(a, b);
    container.insertBefore(b, placeholder);
    container.removeChild(placeholder);

    const lastA = a.getBoundingClientRect();
    const lastB = b.getBoundingClientRect();
    const dxA = firstA.left - lastA.left, dyA = firstA.top - lastA.top;
    const dxB = firstB.left - lastB.left, dyB = firstB.top - lastB.top;

    [a, b].forEach(el => { el.style.transition = "none"; el.style.zIndex = "5"; });
    a.style.transform = `translate(${dxA}px, ${dyA}px)`;
    b.style.transform = `translate(${dxB}px, ${dyB}px)`;
    void a.offsetWidth; // forzar reflow antes de animar

    [a, b].forEach(el => { el.style.transition = "transform 0.32s ease"; });
    a.style.transform = "";
    b.style.transform = "";

    round++;
    setTimeout(doRound, 340);
  }
  doRound();
}

function getAudioCtx() {
  if (isMuted) return null;
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration, type, delay) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.15, ctx.currentTime + delay);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime + delay);
  osc.stop(ctx.currentTime + delay + duration);
}
function playCorrectSound() { playTone(523.25, 0.12, "sine", 0); playTone(783.99, 0.18, "sine", 0.1); }
function playWrongSound() { playTone(160, 0.3, "sawtooth", 0); }
function playClickSound() { playTone(700, 0.06, "triangle", 0); playTone(1040, 0.05, "triangle", 0.05); }
function playShuffleSound() {
  for (let i = 0; i < 7; i++) playTone(280 + i * 55, 0.05, "triangle", i * 0.045);
}

// Sonido de clic para cualquier botón que el jugador presione, excepto las
// respuestas del quiz y las cartas bonus (esas ya tienen su propio sonido).
document.addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn || btn.disabled) return;
  if (btn.classList.contains("answer-btn") || btn.classList.contains("bonus-card")) return;
  playClickSound();
});

/* =========================================================
   FUNCIONES DE FIRESTORE
   ========================================================= */
async function getCurrentSeason() {
  if (!db) throw new Error("Firestore no disponible");
  const doc = await db.collection("config").doc("ranking").get();
  if (doc.exists && doc.data().currentSeason) return doc.data().currentSeason;
  return 1;
}

async function loadTimeLimit() {
  if (!db) return DEFAULT_TIME_LIMIT;
  try {
    const doc = await db.collection("config").doc("settings").get();
    if (doc.exists && doc.data().timeLimitSeconds) return doc.data().timeLimitSeconds;
  } catch (err) { console.error(err); }
  return DEFAULT_TIME_LIMIT;
}

async function saveScore(name, grade, subject, score, total) {
  if (!db) throw new Error("Firestore no disponible");
  const season = await getCurrentSeason();
  await db.collection("scores").add({
    name, grade, subject, score, total, season,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  });
}

async function subscribeRanking(grade, subject) {
  const statusEl = document.getElementById("rankingStatus");
  if (!db) { statusEl.textContent = "Ranking no disponible."; return; }
  try {
    const season = await getCurrentSeason();
    rankingUnsubscribe = db.collection("scores")
      .where("season", "==", season)
      .where("grade", "==", grade)
      .where("subject", "==", subject)
      .orderBy("score", "desc")
      .limit(10)
      .onSnapshot(snapshot => {
        renderRankingList(snapshot.docs.map(d => d.data()));
      }, err => {
        console.error(err);
        const s = document.getElementById("rankingStatus");
        if (s) s.textContent = "No se pudo cargar el ranking (revisa la consola del navegador por si falta crear un índice en Firestore).";
      });
  } catch (err) {
    console.error(err);
    if (statusEl) statusEl.textContent = "No se pudo cargar el ranking.";
  }
}

function renderRankingList(list) {
  const statusEl = document.getElementById("rankingStatus");
  const listEl = document.getElementById("rankingList");
  if (!listEl) return;
  if (list.length === 0) {
    listEl.innerHTML = "";
    if (statusEl) statusEl.textContent = "Todavía no hay puntajes en esta ronda.";
    return;
  }
  if (statusEl) statusEl.textContent = "";
  listEl.innerHTML = list.map((item, i) => `
    <li class="${item.name === state.playerName && item.score === state.score ? 'me' : ''} ${i < 3 ? 'rank-' + (i + 1) : ''}">
      <span class="ranking-rank">#${i + 1}</span>
      <span class="ranking-name">${item.name}</span>
      <span class="ranking-score">${item.score} pts</span>
    </li>
  `).join("");
}

async function loadQuestions(grade, subject) {
  if (db) {
    try {
      const snap = await db.collection("questions").where("grade", "==", grade).where("subject", "==", subject).get();
      if (!snap.empty) {
        const custom = snap.docs.map(d => d.data());
        return shuffle(custom).slice(0, Math.min(5, custom.length)).map(shuffleQuestionOptions);
      }
    } catch (err) { console.error(err); }
  }
  const fallback = (questionBank[grade] && questionBank[grade][subject]) || [];
  if (fallback.length === 0) return [];
  return shuffle([...fallback]).slice(0, Math.min(5, fallback.length)).map(shuffleQuestionOptions);
}

// Revuelve el orden de las 4 opciones de una pregunta, ajustando cuál
// posición es ahora la correcta, para que no siempre quede en el mismo lugar.
function shuffleQuestionOptions(q) {
  const order = shuffle([0, 1, 2, 3].slice(0, q.options.length));
  const newOptions = order.map(i => q.options[i]);
  const newCorrect = order.indexOf(q.correct);
  return { ...q, options: newOptions, correct: newCorrect };
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* =========================================================
   MODO PROYECTOR
   Se activa con ?proyector=1 en el link (opcionalmente
   &grado=7mo y/o &materia=matematicas para filtrar).
   Pantalla de solo lectura, sin botones, pensada para TV.
   ========================================================= */
function renderProjectorMode(grade, subject) {
  document.body.innerHTML = `
    <div class="projector-wrap">
      <h1 class="projector-title"><span class="live-dot"></span>Ranking en vivo</h1>
      <p class="projector-sub">${grade !== "all" ? grade : "Todos los niveles"} · ${subject !== "all" ? (subjectLabels[subject] || subject) : "Todas las materias"}</p>
      <ol class="projector-list" id="projectorList"><li class="projector-empty">Cargando...</li></ol>
    </div>
  `;
  subscribeProjectorRanking(grade, subject);
}

async function subscribeProjectorRanking(grade, subject) {
  const listEl = document.getElementById("projectorList");
  if (!db) { if (listEl) listEl.innerHTML = `<li class="projector-empty">Ranking no disponible.</li>`; return; }
  try {
    const season = await getCurrentSeason();
    let query = db.collection("scores").where("season", "==", season);
    if (grade !== "all") query = query.where("grade", "==", grade);
    if (subject !== "all") query = query.where("subject", "==", subject);
    query.orderBy("score", "desc").limit(10).onSnapshot(snapshot => {
      const list = snapshot.docs.map(d => d.data());
      const el = document.getElementById("projectorList");
      if (!el) return;
      if (list.length === 0) { el.innerHTML = `<li class="projector-empty">Todavía no hay puntajes.</li>`; return; }
      el.innerHTML = list.map((item, i) => `
        <li class="${i < 3 ? 'rank-' + (i + 1) : ''}"><span class="proj-rank">#${i + 1}</span><span class="proj-name">${item.name}</span><span class="proj-score">${item.score} pts</span></li>
      `).join("");
    }, err => {
      console.error(err);
      const el = document.getElementById("projectorList");
      if (el) el.innerHTML = `<li class="projector-empty">No se pudo cargar (revisa si falta crear un índice en Firestore, F12).</li>`;
    });
  } catch (err) {
    console.error(err);
    if (listEl) listEl.innerHTML = `<li class="projector-empty">No se pudo cargar el ranking.</li>`;
  }
}

if (urlParams.get("proyector") === "1") {
  renderProjectorMode(urlParams.get("grado") || "all", urlParams.get("materia") || "all");
} else {
  render();
}
